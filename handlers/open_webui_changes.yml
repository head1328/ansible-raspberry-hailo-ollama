---

- name: Reload systemd user daemon
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ hailo_ollama_webui_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable and restart open-webui (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ hailo_ollama_webui_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: open-webui.service
    enabled: true
    state: restarted
    scope: user
