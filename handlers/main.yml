---

- name: Restart hailo-ollama
  ansible.builtin.systemd_service:
    name: hailo-ollama.service
    state: restarted
    daemon_reload: true

- name: Handle hailo-ollama caddy changes
  ansible.builtin.include_tasks: hailo_ollama_caddy_changes.yml

- name: Handle open-webui changes
  ansible.builtin.include_tasks: open_webui_changes.yml
