---

- name: Lookup podman user information
  become: true
  ansible.builtin.getent:
    database: passwd
    key: "{{ hailo_ollama_webui_podman_user }}"
  register: hailo_ollama_webui_getent

- name: Set XDG_RUNTIME_DIR for podman user
  ansible.builtin.set_fact:
    hailo_ollama_webui_xdg_runtime_dir: "/run/user/{{ hailo_ollama_webui_getent.ansible_facts.getent_passwd[hailo_ollama_webui_podman_user][1] }}"

- name: Ensure quadlet directory exists (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  ansible.builtin.file:
    path: "{{ hailo_ollama_webui_podman_home }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Ensure shared podman network exists (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  containers.podman.podman_network:
    name: internal
    state: present

- name: Create open-webui quadlet (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  containers.podman.podman_container:
    name: open-webui
    image: "{{ hailo_ollama_webui_image }}"
    state: quadlet
    quadlet_dir: "{{ hailo_ollama_webui_podman_home }}/.config/containers/systemd"
    env:
      OLLAMA_BASE_URL: >-
        {{ 'http://hailo-ollama-caddy:9090'
        if hailo_ollama_caddy_enabled
        else 'http://host.containers.internal:'
        + hailo_ollama_port | string }}
      ENABLE_DIRECT_CONNECTIONS: "true"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      TASK_MODEL: "{{ hailo_ollama_webui_default_model }}"
      DEFAULT_MODELS: "{{ hailo_ollama_webui_default_model }}"
    network:
      - internal
    publish:
      - "{{ hailo_ollama_webui_port }}:8080/tcp"
    volume:
      - "open-webui-data:/app/backend/data:Z"
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  notify: Handle open-webui changes

- name: Reload systemd user daemon (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ hailo_ollama_webui_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable and start open-webui (rootless)
  become: true
  become_user: "{{ hailo_ollama_webui_podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ hailo_ollama_webui_xdg_runtime_dir }}"
  ansible.builtin.systemd_service:
    name: open-webui.service
    enabled: true
    state: started
    scope: user
