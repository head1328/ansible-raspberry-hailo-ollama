---
- name: Verify Hailo Ollama package URLs are reachable
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Check raspberry GenAI Model Zoo URL (5.1.1)
      ansible.builtin.uri:
        url: "https://dev-public.hailo.ai/2025_12/Hailo10/hailo_gen_ai_model_zoo_5.1.1_arm64.deb"
        method: HEAD
      register: raspberry_url
      failed_when: raspberry_url.status != 200

    - name: Check vendor GenAI Model Zoo URL (5.3.0)
      ansible.builtin.uri:
        url: "https://dev-public.hailo.ai/2026_04/Hailo10/hailo_gen_ai_model_zoo_5.3.0_arm64.deb"
        method: HEAD
      register: vendor_url
      failed_when: vendor_url.status != 200

    - name: Report results
      ansible.builtin.debug:
        msg:
          - "raspberry (5.1.1): reachable"
          - "vendor (5.3.0): reachable"
