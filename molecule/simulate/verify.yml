---
- name: Verify Hailo Ollama package is downloadable
  hosts: all
  become: false
  gather_facts: true

  tasks:
    - name: Check Hailo GenAI Model Zoo URL is reachable
      ansible.builtin.uri:
        url: "https://dev-public.hailo.ai/2026_04/Hailo10/hailo_gen_ai_model_zoo_5.3.0_arm64.deb"
        method: HEAD
      register: deb_url
      failed_when: deb_url.status != 200
